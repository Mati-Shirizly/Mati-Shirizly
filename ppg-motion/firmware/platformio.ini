; ESP32 + MAX30105 raw red/IR/green streamer
; Build & flash:   pio run -t upload
; Serial monitor:  pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
; No external libraries: src/max30105.* is a register-level driver.
