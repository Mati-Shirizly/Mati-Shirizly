<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Viewer</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Marked.js for markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <!-- html2pdf.js for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header with controls -->
        <header class="header">
            <h1>Markdown Viewer</h1>
            <div class="controls">
                <!-- Theme selector -->
                <div class="theme-selector">
                    <label for="theme">Theme:</label>
                    <select id="theme" class="theme-dropdown">
                        <option value="system">System</option>
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                    </select>
                </div>

                <!-- File input -->
                <div class="file-input-wrapper">
                    <label for="file-input" class="file-label">Choose MD File</label>
                    <input type="file" id="file-input" accept=".md,.markdown" />
                </div>

                <!-- Action buttons -->
                <button id="print-btn" class="action-btn" disabled>
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M14 5H2a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1h1v2a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-2h1a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1zM4 3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2H4V3zm8 10H4v-4h8v4z"/>
                    </svg>
                    Print
                </button>
                <button id="pdf-btn" class="action-btn" disabled>
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 12L3 7h3V1h4v6h3l-5 5z"/>
                        <path d="M14 13v1H2v-1h12z"/>
                    </svg>
                    Save as PDF
                </button>
            </div>
        </header>

        <!-- Main content area -->
        <main class="main-content">
            <div id="drop-zone" class="drop-zone">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                    <polyline points="13 2 13 9 20 9"></polyline>
                </svg>
                <p>Drop a Markdown file here or click "Choose MD File" to get started</p>
            </div>

            <div id="preview-container" class="preview-container hidden">
                <div id="markdown-preview" class="markdown-content"></div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
